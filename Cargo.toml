[package]
name = "spotify-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Auth / crypto (PKCE)
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"

# URL encoding
urlencoding = "2"

# Opening browser
open = "5"

# Config / token storage
dirs = "5"

# Error handling
anyhow = "1"

# Env vars
dotenvy = "0.15"

# Config file
toml = "0.8"